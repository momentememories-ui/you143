<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anniversary Card - Realistic Burn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #ffffff; /* พื้นหลังสีขาวตามขอ */
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* คอนเทนเนอร์การ์ดเต็มจอ */
    .card-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ชั้นที่ 3: ข้อความ (กระดาษ3.png) */
    .layer-3-message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
    }

    /* ชั้นที่ 2: Canvas กระดาษเผา (กระดาษ2.png) */
    #burnCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Canvas สำหรับวาดประกายไฟขอบไหม้ */
    #fxCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* ชั้นที่ 1: กล่อง (กล่อง.png) */
    .layer-1-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 4;
      pointer-events: none;
    }

    /* --- ส่วนกล่องไม้ขีดไฟซ้ายล่าง (ขยายใหญ่ขึ้น 20%) --- */
    .matchbox-area {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .matchbox-striker {
      width: 156px; /* ขยายขึ้น 20% */
      height: 48px;
      background: #4a2c11;
      border: 3px solid #2d1908;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d7ccc8;
      font-size: 12px;
      font-weight: bold;
      background-image: repeating-linear-gradient(45deg, #3e2723 0, #3e2723 4px, #4e342e 4px, #4e342e 8px);
    }

    .matchstick-item {
      width: 84px; /* ขยายขึ้น 20% */
      height: 18px;
      cursor: grab;
      position: relative;
      transition: transform 0.1s;
    }

    .matchstick-item:active {
      cursor: grabbing;
    }

    .matchstick-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* เปลวไฟขยับได้ตรงหัวไม้ขีด */
    .flame-animated {
      position: absolute;
      top: -25px;
      left: -10px;
      width: 30px;
      height: 40px;
      background: radial-gradient(ellipse at bottom, #ffffff 0%, #ffeb3b 25%, #ff9800 60%, transparent 80%);
      border-radius: 50% 50% 35% 35%;
      filter: drop-shadow(0 0 10px #ff5722);
      animation: flameMotion 0.15s infinite alternate ease-in-out;
      display: none;
      pointer-events: none;
    }

    @keyframes flameMotion {
      0% { transform: scale(0.9) rotate(-3deg); opacity: 0.9; }
      100% { transform: scale(1.1) rotate(4deg); opacity: 1; }
    }

    /* ส่วนหัวใจกดค้าง */
    .controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
    }

    .heart-section {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      animation: fadeIn 1s forwards;
    }

    .heart-btn {
      font-size: 45px;
      cursor: pointer;
      filter: grayscale(100%);
      transition: transform 0.1s;
    }

    .heart-btn:active { transform: scale(0.9); }

    .progress-bar-bg {
      width: 180px;
      height: 10px;
      background-color: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff80ab, #ff4081);
      transition: width 0.1s linear;
    }

    /* Modal ป๊อปอัปโพลารอยด์ */
    .polaroid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .polaroid-container { position: relative; width: 100%; height: 100%; }

    .polaroid {
      position: absolute;
      width: 190px;
      background: white;
      padding: 10px 10px 20px 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.3s, z-index 0.3s;
      animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
    }

    .polaroid img { width: 100%; height: 150px; object-fit: cover; }
    .polaroid .caption { text-align: center; font-size: 13px; color: #333; margin-top: 8px; font-weight: bold; }
    .polaroid.active { transform: scale(1.6) translate(-25%, -25%) !important; z-index: 999 !important; }

    @keyframes popUp {
      0% { transform: scale(0); opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- เสียงเพลง background (วนลูป) -->
  <audio id="bgMusic" loop autoplay>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="card-container" id="cardContainer">
    <!-- ชั้นที่ 3: ข้อความ -->
    <img src="กระดาษ3.png" class="layer-3-message" alt="ข้อความ">

    <!-- ชั้นที่ 2: Canvas กระดาษเผา -->
    <canvas id="burnCanvas"></canvas>

    <!-- Canvas แสดงประกายไฟ/ขอบไหม้ลุกลาม -->
    <canvas id="fxCanvas"></canvas>

    <!-- ชั้นที่ 1: กล่อง -->
    <img src="กล่อง.png" class="layer-1-box" alt="กล่อง">
  </div>

  <!-- กล่องไม้ขีดมุมซ้ายล่าง -->
  <div class="matchbox-area">
    <div class="matchbox-striker" id="strikerStrip">
      ถูไม้ขีดตรงนี้ 🔥
    </div>
    <div class="matchstick-item" id="draggableMatch">
      <div class="flame-animated" id="flame"></div>
      <img src="ไม้ขีด.png" alt="ไม้ขีด">
    </div>
  </div>

  <!-- ส่วนหัวใจกดค้าง -->
  <div class="controls">
    <div class="heart-section" id="heartSection">
      <p style="color: #c2185b; font-size: 13px; font-weight: bold;">กดค้างที่หัวใจเพื่อเติมความทรงจำ ❤️</p>
      <div class="heart-btn" id="heartBtn">❤️</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- ป๊อปอัปโพลารอยด์ 5 ภาพ -->
  <div class="polaroid-overlay" id="polaroidOverlay">
    <div class="polaroid-container" id="polaroidContainer"></div>
  </div>

  <script>
    const canvas = document.getElementById('burnCanvas');
    const ctx = canvas.getContext('2d');
    const fxCanvas = document.getElementById('fxCanvas');
    const fxCtx = fxCanvas.getContext('2d');
    const bgMusic = document.getElementById('bgMusic');

    const matchEl = document.getElementById('draggableMatch');
    const flameEl = document.getElementById('flame');
    const strikerStrip = document.getElementById('strikerStrip');

    let isLit = false;
    let strikeCount = 0;
    let isDraggingMatch = false;
    let autoBurning = false;
    let burnRadius = 0;
    let maxBurnRadius = 0;

    // ปรับขนาด Canvas เต็มจอ
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
      maxBurnRadius = Math.max(canvas.width, canvas.height) * 0.7;
      drawPaper();
    }

    const paperImg = new Image();
    paperImg.src = 'กระดาษ2.png';
    paperImg.onload = () => resizeCanvas();

    function drawPaper() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(paperImg, 0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('click', () => {
      if (bgMusic.paused) bgMusic.play();
    }, { once: true });

    /* --- ระบบลากไม้ขีดไฟ --- */
    let matchX = 0, matchY = 0;

    matchEl.addEventListener('mousedown', (e) => {
      isDraggingMatch = true;
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDraggingMatch) return;

      matchX = e.clientX;
      matchY = e.clientY;

      matchEl.style.position = 'fixed';
      matchEl.style.left = (matchX - 20) + 'px';
      matchEl.style.top = (matchY - 10) + 'px';
      matchEl.style.zIndex = '99';

      // เช็คการถูกับแถบข้างกล่อง
      if (!isLit) {
        const strikerRect = strikerStrip.getBoundingClientRect();
        if (matchX >= strikerRect.left && matchX <= strikerRect.right &&
            matchY >= strikerRect.top && matchY <= strikerRect.bottom) {
          strikeCount += 1;
          if (strikeCount > 15) { // ถูประมาณ 3-4 รอบติดไฟ
            isLit = true;
            flameEl.style.display = 'block';
            strikerStrip.innerText = 'จุดติดแล้ว! นำไปจุดตรงกลาง';
          }
        }
      }

      // เช็คเมื่อนำไม้ขีดติดไฟไปแตะบริเวณตรงกลางจอ
      if (isLit && !autoBurning) {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distFromCenter = Math.hypot(matchX - centerX, matchY - centerY);

        if (distFromCenter < 120) {
          startAutoBurn(centerX, centerY);
        }
      }
    });

    window.addEventListener('mouseup', () => { isDraggingMatch = false; });

    /* --- ระบบกระดาษไหม้อัตโนมัติจากตรงกลาง --- */
    function startAutoBurn(cx, cy) {
      autoBurning = true;
      burnRadius = 10;

      function burnStep() {
        if (burnRadius < maxBurnRadius) {
          burnRadius += 3.5; // ความเร็วการลุกลาม

          // 1. เจาะรูไหม้กระดาษชั้นที่ 2
          ctx.save();
          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath();
          ctx.arc(cx, cy, burnRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // 2. วาดขอบไหม้สมจริงสีดำ/ส้มลุกลามลง Canvas FX
          fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
          fxCtx.save();
          fxCtx.beginPath();
          fxCtx.arc(cx, cy, burnRadius + 8, 0, Math.PI * 2);
          fxCtx.strokeStyle = 'rgba(255, 69, 0, 0.8)';
          fxCtx.lineWidth = 14;
          fxCtx.shadowColor = '#ff2200';
          fxCtx.shadowBlur = 18;
          fxCtx.stroke();

          fxCtx.beginPath();
          fxCtx.arc(cx, cy, burnRadius, 0, Math.PI * 2);
          fxCtx.strokeStyle = 'rgba(30, 20, 10, 0.9)';
          fxCtx.lineWidth = 8;
          fxCtx.stroke();
          fxCtx.restore();

          requestAnimationFrame(burnStep);
        } else {
          // เผาเสร็จสิ้น
          fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
          document.getElementById('heartSection').style.display = 'flex';
        }
      }

      burnStep();
    }

    /* --- ระบบกดค้างหัวใจ --- */
    const heartBtn = document.getElementById('heartBtn');
    const progressFill = document.getElementById('progressFill');
    let holdTimer = null;
    let progress = 0;

    function startHold() {
      holdTimer = setInterval(() => {
        if (progress < 100) {
          progress += 3;
          progressFill.style.width = progress + '%';
          heartBtn.style.filter = `grayscale(${100 - progress}%)`;
        } else {
          clearInterval(holdTimer);
          showPolaroids();
        }
      }, 50);
    }

    function stopHold() {
      clearInterval(holdTimer);
      if (progress < 100) {
        progress = 0;
        progressFill.style.width = '0%';
        heartBtn.style.filter = 'grayscale(100%)';
      }
    }

    heartBtn.addEventListener('mousedown', startHold);
    heartBtn.addEventListener('mouseup', stopHold);
    heartBtn.addEventListener('mouseleave', stopHold);
    heartBtn.addEventListener('touchstart', startHold);
    heartBtn.addEventListener('touchend', stopHold);

    /* --- ระบบโพลารอยด์ป๊อปอัป 5 ภาพ --- */
    const polaroidData = [
      { img: 'img1.jpg', text: 'รูปแรกของเรา 💕', top: '18%', left: '15%', rotate: '-12deg' },
      { img: 'img2.jpg', text: 'ทริปเที่ยวด้วยกัน 🌊', top: '15%', left: '60%', rotate: '10deg' },
      { img: 'img3.jpg', text: 'รอยยิ้มนี้ชอบที่สุด 😊', top: '48%', left: '22%', rotate: '-6deg' },
      { img: 'img4.jpg', text: 'กินของอร่อยด้วยกัน 🍰', top: '45%', left: '58%', rotate: '15deg' },
      { img: 'img5.jpg', text: 'อยู่ด้วยกันไปนานๆ นะ ❤️', top: '28%', left: '40%', rotate: '2deg' }
    ];

    function showPolaroids() {
      const overlay = document.getElementById('polaroidOverlay');
      const container = document.getElementById('polaroidContainer');
      overlay.style.display = 'flex';

      polaroidData.forEach((item, index) => {
        setTimeout(() => {
          const card = document.createElement('div');
          card.className = 'polaroid';
          card.style.top = item.top;
          card.style.left = item.left;
          card.style.transform = `rotate(${item.rotate})`;
          card.style.zIndex = index + 1;

          card.innerHTML = `
            <img src="${item.img}" alt="memory">
            <div class="caption">${item.text}</div>
          `;

          card.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.polaroid').forEach(p => p.classList.remove('active'));
            card.classList.add('active');
          });

          container.appendChild(card);
        }, index * 200);
      });
    }

    document.getElementById('polaroidOverlay').addEventListener('click', () => {
      document.querySelectorAll('.polaroid').forEach(p => p.classList.remove('active'));
    });
  </script>
</body>
</html>
