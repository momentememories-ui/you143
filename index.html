<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anniversary Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* คอนเทนเนอร์ขยายเต็มหน้าจอ */
    .card-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ชั้นที่ 3: ข้อความ (กระดาษ3.png) ขยายเต็มจอ */
    .layer-3-message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill; /* ปรับภาพยืดเต็มพื้นที่ */
      z-index: 1;
    }

    /* ชั้นที่ 2: Canvas กระดาษเผา (กระดาษ2.png) */
    #burnCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* ชั้นที่ 1: กล่อง (กล่อง.png) ขยายเต็มจอ */
    .layer-1-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill; /* ปรับภาพยืดเต็มพื้นที่ */
      z-index: 3;
      pointer-events: none;
    }

    /* ตัวลอยไม้ขีดไฟ */
    .matchstick-cursor {
      position: fixed;
      width: 60px;
      height: 60px;
      pointer-events: none;
      z-index: 99;
      transform: translate(-10px, -10px) rotate(-20deg);
      display: none;
    }

    .matchstick-cursor img {
      width: 100%;
      height: auto;
    }

    /* ประกายไฟตรงหัวไม้ขีด */
    .flame {
      position: absolute;
      top: -12px;
      left: 18px;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #ffff00 20%, #ff4500 70%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 15px #ff4500, 0 0 25px #ff8c00;
      animation: flicker 0.1s infinite alternate;
      display: none;
    }

    @keyframes flicker {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    /* ปุ่มจุดไม้ขีดไฟและส่วนควบคุม (จัดวางลอยด้านบนหน้าจอ) */
    .controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .btn-ignite {
      padding: 14px 32px;
      background-color: #ff4081;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
    }

    .btn-ignite:hover {
      background-color: #f50057;
      transform: scale(1.05);
    }

    /* ส่วนหัวใจกดค้าง */
    .heart-section {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 24px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      animation: fadeIn 1s forwards;
    }

    .heart-btn {
      font-size: 50px;
      cursor: pointer;
      filter: grayscale(100%);
      transition: transform 0.1s;
    }

    .heart-btn:active {
      transform: scale(0.9);
    }

    .progress-bar-bg {
      width: 220px;
      height: 12px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff80ab, #ff4081);
      transition: width 0.1s linear;
    }

    /* Modal ป๊อปอัปโพลารอยด์ */
    .polaroid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .polaroid-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .polaroid {
      position: absolute;
      width: 200px;
      background: white;
      padding: 12px 12px 24px 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.3s, z-index 0.3s;
      animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
    }

    .polaroid img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 2px;
    }

    .polaroid .caption {
      text-align: center;
      font-size: 14px;
      color: #333;
      margin-top: 10px;
      font-weight: bold;
    }

    .polaroid.active {
      transform: scale(1.6) translate(-25%, -25%) !important;
      z-index: 999 !important;
    }

    @keyframes popUp {
      0% { transform: scale(0); opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- เสียงเพลง background (วนลูป) -->
  <audio id="bgMusic" loop autoplay>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="card-container" id="cardContainer">
    <!-- ชั้นที่ 3: ข้อความ -->
    <img src="กระดาษ3.png" class="layer-3-message" alt="ข้อความ">

    <!-- ชั้นที่ 2: กระดาษสำหรับเผา -->
    <canvas id="burnCanvas"></canvas>

    <!-- ชั้นที่ 1: กล่อง -->
    <img src="กล่อง.png" class="layer-1-box" alt="กล่อง">
  </div>

  <div class="controls">
    <button class="btn-ignite" id="igniteBtn" onclick="igniteMatch()">🔥 จุดไม้ขีดไฟ</button>

    <!-- ส่วนหัวใจกดค้าง -->
    <div class="heart-section" id="heartSection">
      <p style="color: #fff; font-size: 14px; text-shadow: 0 1px 3px #000;">กดค้างที่หัวใจเพื่อเติมความทรงจำ ❤️</p>
      <div class="heart-btn" id="heartBtn">❤️</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- ไม้ขีดไฟลอยตาม Cursor -->
  <div class="matchstick-cursor" id="matchCursor">
    <div class="flame" id="flame"></div>
    <img src="ไม้ขีด.png" alt="ไม้ขีด">
  </div>

  <!-- ป๊อปอัปโพลารอยด์ 5 ภาพ -->
  <div class="polaroid-overlay" id="polaroidOverlay">
    <div class="polaroid-container" id="polaroidContainer"></div>
  </div>

  <script>
    const canvas = document.getElementById('burnCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('cardContainer');
    const matchCursor = document.getElementById('matchCursor');
    const flame = document.getElementById('flame');
    const bgMusic = document.getElementById('bgMusic');

    let isIgnited = false;
    let isBurning = false;
    let burnedPixels = 0;
    let heartTriggered = false;

    // ฟังก์ชันปรับขนาด Canvas ให้ตรงกับขนาดหน้าจอจริงเสมอ
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawPaper();
    }

    // ดึงรูปกระดาษ2.png มาวาดลงบน Canvas
    const paperImg = new Image();
    paperImg.src = 'กระดาษ2.png';
    paperImg.onload = () => {
      resizeCanvas();
    };

    function drawPaper() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(paperImg, 0, 0, canvas.width, canvas.height);
    }

    // ปรับขนาด Canvas อัตโนมัติเมื่อมีการย่อ/ขยายหน้าจอ
    window.addEventListener('resize', resizeCanvas);

    // เล่นเพลงอัตโนมัติเมื่อมีการสัมผัส/คลิกหน้าจอครั้งแรก
    window.addEventListener('click', () => {
      if (bgMusic.paused) bgMusic.play();
    }, { once: true });

    // ขยับไม้ขีดไฟตาม Cursor
    window.addEventListener('mousemove', (e) => {
      matchCursor.style.left = e.clientX + 'px';
      matchCursor.style.top = e.clientY + 'px';
    });

    // กดปุ่มจุดไม้ขีดไฟ
    function igniteMatch() {
      isIgnited = true;
      flame.style.display = 'block';
      matchCursor.style.display = 'block';
      document.getElementById('igniteBtn').style.display = 'none';
    }

    container.addEventListener('mouseenter', () => {
      if (isIgnited) matchCursor.style.display = 'block';
    });

    container.addEventListener('mouseleave', () => {
      matchCursor.style.display = 'none';
      isBurning = false;
    });

    // เริ่มการลากเผากระดาษ
    container.addEventListener('mousedown', (e) => {
      if (isIgnited) { isBurning = true; burn(e); }
    });
    container.addEventListener('mouseup', () => isBurning = false);
    container.addEventListener('mousemove', (e) => {
      if (isIgnited && isBurning) burn(e);
    });

    // รองรับสัมผัสหน้าจอมือถือ
    container.addEventListener('touchstart', (e) => {
      if (isIgnited) { isBurning = true; burn(e.touches[0]); }
    });
    container.addEventListener('touchend', () => isBurning = false);
    container.addEventListener('touchmove', (e) => {
      if (isIgnited && isBurning) burn(e.touches[0]);
    });

    // ฟังก์ชันรอยไหม้และเจาะรู
    function burn(e) {
      const x = e.clientX;
      const y = e.clientY;

      // ขอบไหม้สีส้ม
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath();
      ctx.arc(x, y, 35, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(230, 80, 10, 0.5)';
      ctx.shadowColor = '#ff4500';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.restore();

      // ลบกระดาษออก
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      burnedPixels += 1;
      // เมื่อเผากระดาษไปได้ระดับหนึ่ง ให้แสดงส่วนกดหัวใจ
      if (burnedPixels > 80 && !heartTriggered) {
        heartTriggered = true;
        document.getElementById('heartSection').style.display = 'flex';
      }
    }

    /* --- ระบบกดค้างหัวใจ --- */
    const heartBtn = document.getElementById('heartBtn');
    const progressFill = document.getElementById('progressFill');
    let holdTimer = null;
    let progress = 0;

    function startHold() {
      holdTimer = setInterval(() => {
        if (progress < 100) {
          progress += 3;
          progressFill.style.width = progress + '%';
          heartBtn.style.filter = `grayscale(${100 - progress}%)`;
        } else {
          clearInterval(holdTimer);
          showPolaroids();
        }
      }, 50);
    }

    function stopHold() {
      clearInterval(holdTimer);
      if (progress < 100) {
        progress = 0;
        progressFill.style.width = '0%';
        heartBtn.style.filter = 'grayscale(100%)';
      }
    }

    heartBtn.addEventListener('mousedown', startHold);
    heartBtn.addEventListener('mouseup', stopHold);
    heartBtn.addEventListener('mouseleave', stopHold);
    heartBtn.addEventListener('touchstart', startHold);
    heartBtn.addEventListener('touchend', stopHold);

    /* --- ระบบโพลารอยด์ป๊อปอัป 5 ภาพ --- */
    const polaroidData = [
      { img: 'img1.jpg', text: 'รูปแรกของเรา 💕', top: '18%', left: '15%', rotate: '-12deg' },
      { img: 'img2.jpg', text: 'ทริปเที่ยวด้วยกัน 🌊', top: '15%', left: '60%', rotate: '10deg' },
      { img: 'img3.jpg', text: 'รอยยิ้มนี้ชอบที่สุด 😊', top: '48%', left: '22%', rotate: '-6deg' },
      { img: 'img4.jpg', text: 'กินของอร่อยด้วยกัน 🍰', top: '45%', left: '58%', rotate: '15deg' },
      { img: 'img5.jpg', text: 'อยู่ด้วยกันไปนานๆ นะ ❤️', top: '28%', left: '40%', rotate: '2deg' }
    ];

    function showPolaroids() {
      const overlay = document.getElementById('polaroidOverlay');
      const container = document.getElementById('polaroidContainer');
      overlay.style.display = 'flex';

      polaroidData.forEach((item, index) => {
        setTimeout(() => {
          const card = document.createElement('div');
          card.className = 'polaroid';
          card.style.top = item.top;
          card.style.left = item.left;
          card.style.transform = `rotate(${item.rotate})`;
          card.style.zIndex = index + 1;

          card.innerHTML = `
            <img src="${item.img}" alt="memory">
            <div class="caption">${item.text}</div>
          `;

          // กดซูมรูปเฉพาะใบที่คลิก
          card.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.polaroid').forEach(p => p.classList.remove('active'));
            card.classList.add('active');
          });

          container.appendChild(card);
        }, index * 200);
      });
    }

    // คลิกพื้นที่ว่างเพื่อขยายรูปกลับขนาดปกติ
    document.getElementById('polaroidOverlay').addEventListener('click', () => {
      document.querySelectorAll('.polaroid').forEach(p => p.classList.remove('active'));
    });
  </script>
</body>
</html>
